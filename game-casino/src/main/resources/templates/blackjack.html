<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blackjack - Game Casino</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 25px 15px;
            font-family: "Segoe UI", "Meiryo", sans-serif;
            background: linear-gradient(135deg, #10251e, #0b1713);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 750px;
            padding: 35px;
            text-align: center;
            background: #194d3b;
            border: 2px solid #c9a849;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        h1 {
            color: #f5d76e;
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 5px #000000;
        }

        h2 {
            color: #f5d76e;
            margin-top: 25px;
        }

        .player-info {
            margin: 20px 0;
            padding: 15px;
            background: #10251e;
            border: 1px solid #c9a849;
            border-radius: 12px;
        }

        .player-info strong {
            color: #f5d76e;
        }

        .game-area {
            margin-top: 25px;
            padding: 20px;
            background: #10251e;
            border: 1px solid #c9a849;
            border-radius: 15px;
        }

        .card-area {
            margin: 15px 0;
            padding: 20px 10px;
            background: #194d3b;
            border-radius: 12px;
        }

        .cards {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }

        .card {
            min-width: 55px;
            padding: 15px 10px;
            background: #ffffff;
            color: #10251e;
            border: 2px solid #c9a849;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .hidden-card {
            background: #173d30;
            color: #f5d76e;
            border: 2px dashed #f5d76e;
        }

        .score {
            color: #f5d76e;
            font-size: 20px;
            font-weight: bold;
        }

        .bet-info {
            margin: 20px 0;
            color: #f5d76e;
            font-size: 18px;
            font-weight: bold;
        }

        input[type="number"] {
            width: 100%;
            max-width: 250px;
            padding: 12px;
            border: 2px solid #c9a849;
            border-radius: 8px;
            background: #10251e;
            color: #ffffff;
            font-size: 17px;
            text-align: center;
        }

        button {
            padding: 13px 30px;
            margin: 8px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #f5d76e, #c9a849);
            color: #10251e;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .hit-button {
            background: #d94b4b;
            color: #ffffff;
        }

        .stand-button {
            background: #397fc4;
            color: #ffffff;
        }

        .result {
            margin: 20px 0;
            padding: 20px;
            background: #10251e;
            border: 2px solid #f5d76e;
            border-radius: 12px;
            color: #f5d76e;
            font-size: 22px;
            font-weight: bold;
        }

        .error {
            margin: 15px 0;
            padding: 12px;
            background: #5c2020;
            border: 1px solid #ff8585;
            border-radius: 8px;
            color: #ffffff;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #f5d76e;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 550px) {
            .container {
                padding: 25px 15px;
            }

            h1 {
                font-size: 26px;
            }

            .card {
                min-width: 45px;
                font-size: 20px;
                padding: 12px 8px;
            }

            button {
                width: 100%;
                margin: 6px 0;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>♠️ Blackjack ♠️</h1>

    <p>21を目指してディーラーと勝負しよう！</p>

    <!-- プレイヤー情報 -->
    <div class="player-info" th:if="${player != null}">

        <p>
            プレイヤー：
            <strong th:text="${player.playerName}"></strong>
        </p>

        <p>
            💰 Coin：
            <strong th:text="${player.coin}"></strong> C
        </p>

        <p>
            📉 Debt：
            <strong th:text="${player.debt}"></strong> C
        </p>

        <p>
            ⚖️ Balance：
            <strong th:text="${player.balance}"></strong> C
        </p>

    </div>

    <!-- エラー表示 -->
    <div class="error" th:if="${error != null}">
        <p th:text="${error}"></p>
    </div>

    <!-- ゲーム中 -->
    <div th:if="${playing == true}">

        <div class="bet-info">
            掛け金：
            <span th:text="${bet}"></span> C
        </div>

        <div class="game-area">

            <!-- プレイヤーのカード -->
            <div class="card-area">

                <h2>🃏 あなたのカード</h2>

                <div class="cards">

                    <span class="card"
                          th:each="card : ${playerCards}"
                          th:text="${card}">
                    </span>

                </div>

                <p class="score">
                    合計：
                    <span th:text="${playerScore}"></span>
                </p>

            </div>

            <!-- ディーラーのカード -->
            <div class="card-area">

                <h2>🎩 ディーラーのカード</h2>

                <div class="cards">

                    <span th:each="card, stat : ${dealerDisplayCards}"
                          th:class="${stat.index == 1 ? 'card hidden-card' : 'card'}"
                          th:text="${card}">
                    </span>

                </div>

                <p class="score">
                    2枚目のカードは伏せられています
                </p>

            </div>

        </div>

        <!-- HITボタン -->
        <form action="/blackjack/hit" method="post">

            <button type="submit" class="hit-button">
                HIT（カードを引く）
            </button>

        </form>

        <!-- STANDボタン -->
        <form action="/blackjack/stand" method="post">

            <button type="submit" class="stand-button">
                STAND（勝負する）
            </button>

        </form>

    </div>

    <!-- ゲーム終了後 -->
    <div th:if="${playing == false}">

        <div th:if="${result != null}">

            <div class="game-area">

                <h2>🏆 ゲーム結果</h2>

                <!-- プレイヤーのカード -->
                <div class="card-area">

                    <h2>🃏 あなたのカード</h2>

                    <div class="cards">

                        <span class="card"
                              th:each="card : ${playerCards}"
                              th:text="${card}">
                        </span>

                    </div>

                    <p class="score">
                        合計：
                        <span th:text="${playerScore}"></span>
                    </p>

                </div>

                <!-- ディーラーのカード -->
                <div class="card-area">

                    <h2>🎩 ディーラーのカード</h2>

                    <div class="cards">

                        <span class="card"
                              th:each="card : ${dealerDisplayCards}"
                              th:text="${card}">
                        </span>

                    </div>

                    <p class="score">
                        合計：
                        <span th:text="${dealerScore}"></span>
                    </p>

                </div>

            </div>

            <!-- 勝敗結果 -->
            <div class="result">

                <p th:text="${result}"></p>

                <p>
                    払い戻し：
                    <span th:text="${payout}"></span> C
                </p>

            </div>

        </div>

        <!-- ゲーム開始フォーム -->
        <div class="game-area">

            <h2>🎮 ゲーム開始</h2>

            <form action="/blackjack/start" method="post">

                <p>掛け金を入力してください</p>

                <input
                    type="number"
                    name="bet"
                    min="1"
                    value="10"
                    required
                >

                <br>

                <button type="submit">
                    ゲーム開始
                </button>

            </form>

        </div>

    </div>

    <a href="/player" class="back-link">
        ← ゲーム選択画面に戻る
    </a>

</div>

</body>
</html>
