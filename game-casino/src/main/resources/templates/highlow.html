<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High & Low - Game Casino</title>
</head>

<body>

    <h1>🃏 HIGH & LOW 🃏</h1>
    <hr>

    <div th:if="${player != null}">
        <h2>
            プレイヤー：
            <span th:text="${player.playerName}">プレイヤー名</span>
        </h2>

        <p>Coin：<strong th:text="${player.coin}">10000</strong> C</p>
        <p>Debt：<strong th:text="${player.debt}">0</strong> C</p>
        <p>Balance：<strong th:text="${player.balance}">10000</strong> C</p>
    </div>

    <hr>

    <h2>現在のカード</h2>

    <div style="font-size: 60px; border: 2px solid black;
                display: inline-block; padding: 20px;">
        <span th:text="${currentCardName}">7</span>
    </div>

    <p>次のカードは大きい？ 小さい？</p>

    <div th:if="${error != null}">
        <p th:text="${error}"></p>
    </div>

    <form action="/highlow/play" method="post">
        <input type="hidden" name="currentCard"
               th:value="${currentCard}">

        <p>
            掛け金：
            <input type="number" name="bet"
                   min="1" value="100" required> C
        </p>

        <button type="submit" name="choice" value="HIGH">
            ⬆ HIGH（大きい）
        </button>

        <button type="submit" name="choice" value="LOW">
            ⬇ LOW（小さい）
        </button>
    </form>

    <div th:if="${result != null}">
        <hr>
        <h2>結果</h2>

        <p>
            次のカード：
            <strong th:text="${nextCardName}">8</strong>
        </p>

        <h2 th:text="${result}">結果メッセージ</h2>

        <p>
            掛け金：
            <strong th:text="${bet}">100</strong> C
        </p>

        <p>
            払い戻し：
            <strong th:text="${payout}">200</strong> C
        </p>

        <p>もう一度予想してみよう！</p>
    </div>

    <hr>

    <a href="/">ホームに戻る</a>

</body>
</html>
