<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High & Low - Game Casino</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: "Meiryo", sans-serif;
            background: #10251e;
            color: white;
            text-align: center;
        }

        h1 {
            color: #f5d76e;
            font-size: 32px;
            margin-bottom: 10px;
        }

        h2 {
            color: #f5d76e;
        }

        .subtitle {
            letter-spacing: 3px;
            color: #c9c9c9;
        }

        .panel {
            max-width: 850px;
            margin: 20px auto;
            padding: 20px;
            background: #194d3b;
            border: 2px solid #c9a849;
            border-radius: 15px;
            box-shadow: 0 5px 15px #0005;
        }

        .player-info {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }

        .info-item {
            min-width: 150px;
            padding: 12px;
            background: #123729;
            border: 1px solid #719784;
            border-radius: 10px;
        }

        .info-label {
            color: #c9c9c9;
            font-size: 13px;
        }

        .info-value {
            display: block;
            color: #f5d76e;
            font-size: 22px;
            font-weight: bold;
            margin-top: 5px;
        }

        .card-area {
            margin: 30px auto;
        }

        .card {
            width: 150px;
            height: 205px;
            margin: 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            color: #222;
            border: 5px solid #c9a849;
            border-radius: 15px;
            font-size: 55px;
            font-weight: bold;
            box-shadow: 0 6px 15px #0007;
        }

        .card-label {
            color: #f5d76e;
            font-size: 18px;
        }

        .description {
            font-size: 17px;
            margin: 20px 0;
        }

        .bet-area {
            margin: 25px 0;
        }

        input[type="number"] {
            width: 150px;
            padding: 12px;
            border: 2px solid #c9a849;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
        }

        button {
            padding: 13px 30px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            filter: brightness(1.15);
            transform: translateY(-2px);
        }

        .high-button {
            background: #c94b4b;
            color: white;
        }

        .low-button {
            background: #3979c9;
            color: white;
        }

        .main-button {
            background: #f5d76e;
            color: #222;
        }

        .result-card {
            display: inline-block;
            min-width: 120px;
            padding: 20px;
            margin: 15px;
            background: white;
            color: #222;
            border: 3px solid #c9a849;
            border-radius: 12px;
            font-size: 35px;
            font-weight: bold;
        }

        .result-message {
            padding: 15px;
            background: #123729;
            border: 1px solid #c9a849;
            border-radius: 10px;
            font-size: 22px;
            color: #f5d76e;
        }

        .error {
            padding: 12px;
            margin: 15px 0;
            background: #7d2929;
            border: 1px solid #e77;
            border-radius: 8px;
            color: white;
        }

        .back {
            display: inline-block;
            margin: 20px;
            color: white;
            font-size: 16px;
        }

        .back:hover {
            color: #f5d76e;
        }

        hr {
            border: none;
            border-top: 1px solid #719784;
            margin: 25px 0;
        }

        @media(max-width: 500px) {
            body {
                padding: 8px;
            }

            h1 {
                font-size: 25px;
            }

            .panel {
                padding: 12px 7px;
            }

            .card {
                width: 120px;
                height: 165px;
                font-size: 45px;
            }

            .info-item {
                min-width: 110px;
            }

            button {
                padding: 12px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <h1>🃏 HIGH & LOW 🃏</h1>
    <p class="subtitle">GAME CASINO</p>

    <!-- プレイヤー情報 -->
    <div class="panel" th:if="${player != null}">
        <h3>
            PLAYER：
            <span th:text="${player.playerName}">プレイヤー名</span>
        </h3>

        <div class="player-info">
            <div class="info-item">
                <span class="info-label">COIN</span>
                <strong class="info-value"
                        th:text="${player.coin}">10000</strong>
                C
            </div>

            <div class="info-item">
                <span class="info-label">DEBT</span>
                <strong class="info-value"
                        th:text="${player.debt}">0</strong>
                C
            </div>

            <div class="info-item">
                <span class="info-label">BALANCE</span>
                <strong class="info-value"
                        th:text="${player.balance}">10000</strong>
                C
            </div>
        </div>
    </div>

    <div class="panel" th:if="${player == null}">
        プレイヤーが登録されていません。
    </div>

    <!-- 現在のカード -->
    <div class="panel">
        <h2>🎴 CURRENT CARD</h2>

        <div class="card-area">
            <p class="card-label">現在のカード</p>

            <div class="card">
                <span th:text="${currentCardName}">7</span>
            </div>
        </div>

        <p class="description">
            次のカードは大きい？ 小さい？
        </p>
    </div>

    <!-- エラー表示 -->
    <div class="panel error" th:if="${error != null}">
        <strong th:text="${error}">エラーメッセージ</strong>
    </div>

    <!-- 予想 -->
    <div class="panel">
        <h2>🎯 MAKE YOUR BET</h2>

        <p>次に出るカードを予想しよう！</p>

        <form action="/highlow/play" method="post">

            <input type="hidden"
                   name="currentCard"
                   th:value="${currentCard}">

            <div class="bet-area">
                <label for="bet">掛け金：</label>
                <br><br>

                <input type="number"
                       id="bet"
                       name="bet"
                       min="1"
                       value="100"
                       required>
                C
            </div>

            <p>予想を選択してください</p>

            <button type="submit"
                    name="choice"
                    value="HIGH"
                    class="high-button">
                ⬆ HIGH（大きい）
            </button>

            <button type="submit"
                    name="choice"
                    value="LOW"
                    class="low-button">
                ⬇ LOW（小さい）
            </button>

        </form>
    </div>

    <!-- 結果 -->
    <div class="panel" th:if="${result != null}">

        <h2>🏆 GAME RESULT</h2>

        <p class="card-label">次のカード</p>

        <div class="result-card">
            <span th:text="${nextCardName}">8</span>
        </div>

        <div class="result-message">
            <h2 th:text="${result}">結果メッセージ</h2>
        </div>

        <hr>

        <div class="player-info">

            <div class="info-item">
                <span class="info-label">BET</span>
                <strong class="info-value"
                        th:text="${bet}">100</strong>
                C
            </div>

            <div class="info-item">
                <span class="info-label">PAYOUT</span>
                <strong class="info-value"
                        th:text="${payout}">200</strong>
                C
            </div>

        </div>

        <p class="description">
            もう一度予想してみよう！
        </p>

    </div>

    <!-- ホームへ戻る -->
    <a class="back" href="/">← ホームに戻る</a>

</body>
</html>
