<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot - Game Casino</title>
</head>
<body>
    <h1>🎰 SLOT 🎰</h1>
    <hr>
    <div th:if="${player != null}">
        <h2>
            プレイヤー：
            <span th:text="${player.playerName}">プレイヤー名</span>
        </h2>
        <p>
            Coin：
            <strong th:text="${player.coin}">10000</strong> C
        </p>
        <p>
            Debt：
            <strong th:text="${player.debt}">0</strong> C
        </p>
        <p>
            Balance：
            <strong th:text="${player.balance}">10000</strong> C
        </p>
    </div>
    <hr>
    <!-- スロット結果 -->
    <div th:if="${s1 != null and s2 != null and s3 != null}">
        <h2>結果</h2>
        <div style="font-size: 60px;">
            <span th:text="${s1}">🍒</span>
            <span th:text="${s2}">🍋</span>
            <span th:text="${s3}">🍊</span>
        </div>
        <p>
            賭け金：
            <strong th:text="${bet}">100</strong> C
        </p>
        <p>
            倍率：
            <strong th:text="${multiplier}">0</strong> 倍
        </p>
        <p>
            配当：
            <strong th:text="${payout}">0</strong> C
        </p>
        <h2 th:if="${multiplier > 0}">🎉 WIN! 🎉</h2>
        <h2 th:if="${multiplier == 0}">😢 LOSE...</h2>
    </div>
    <!-- エラーメッセージ -->
    <div th:if="${error != null}">
        <p th:text="${error}"></p>
    </div>
    <!-- 賭け金入力 -->
    <h2>賭け金</h2>
    <form action="/slot/play" method="post">
        <input
            type="number"
            name="bet"
            min="1"
            value="100"
            required
        >
        C
        <br><br>
        <button type="submit">🎰 スロットを回す</button>
    </form>
    <br>
    <a href="/">ホームに戻る</a>
</body>
</html>
